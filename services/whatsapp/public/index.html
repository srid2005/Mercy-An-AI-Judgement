<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wisp</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="app-bar">
    <span class="wordmark">Wisp</span>
  </header>

  <div class="app-shell" id="app-shell">
    <aside class="chat-list-pane">
      <div class="search-box">Search or start a new chat</div>
      <div class="chat-list" id="chat-list">
        <div class="loading">Loading…</div>
      </div>
    </aside>
    <main class="chat-thread-pane" id="chat-thread-pane">
      <div class="thread-empty">Select a chat to start messaging</div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/js/app.js"></script>
    <script>
      // MERCY desktop shell: tell the Orbit browser where we are so its address bar follows.
      (function () {
        if (window.parent === window) return;
        var send = function () {
          try { parent.postMessage({ type: 'mercy:route', path: location.pathname + location.search + location.hash, title: document.title }, '*'); } catch (e) {}
        };
        send();
        addEventListener('hashchange', send);
        addEventListener('popstate', send);
        var ps = history.pushState, rs = history.replaceState;
        history.pushState = function () { ps.apply(this, arguments); send(); };
        history.replaceState = function () { rs.apply(this, arguments); send(); };
        var t = document.querySelector('title');
        if (t && window.MutationObserver) new MutationObserver(send).observe(t, { childList: true, characterData: true, subtree: true });
      })();
    </script>
  </body>
</html>
