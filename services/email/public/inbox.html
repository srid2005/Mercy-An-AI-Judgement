<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quill</title>
<link rel="icon" type="image/png" href="/images/favicon.png" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="app-bar">
    <button class="menu-btn" id="menu-btn" title="Menu">☰</button>
    <a class="brand" id="home-link"><img class="brand-logo" src="/images/quill-logo.png" alt="" /><span class="wordmark">Quill</span></a>
    <div class="search-box">Search mail</div>
    <div class="spacer"></div>
    <button class="refresh-btn" id="refresh-btn" title="Refresh -- fetch new mail" aria-label="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      <span>Refresh</span>
    </button>
    <img class="nav-avatar" id="nav-avatar" src="/images/avatars/meera.png" alt="" title="Log out" />
  </header>

  <div class="app-shell" id="app-shell">
    <aside class="sidebar" id="sidebar">
      <button class="compose-btn" id="compose-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span>Compose</span>
      </button>
      <nav class="folder-nav" id="folder-nav">
        <div class="folder-item" data-folder="inbox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
          <span>Inbox</span>
          <span class="folder-count" id="count-inbox"></span>
        </div>
        <div class="folder-item" data-folder="starred">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span>Starred</span>
        </div>
        <div class="folder-item" data-folder="sent">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
          <span>Sent</span>
        </div>
        <div class="folder-item" data-folder="drafts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h14a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v4"/><path d="M14 2v5h5"/><path d="m2 15 4-4 4 4-4 4z"/></svg>
          <span>Drafts</span>
          <span class="folder-count" id="count-drafts"></span>
        </div>
        <div class="folder-item" data-folder="trash">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          <span>Trash</span>
        </div>
      </nav>
    </aside>

    <main class="mail-main" id="mail-main">
      <div class="loading">Loading…</div>
    </main>
  </div>

  <!-- Compose popup -->
  <div class="compose-modal" id="compose-modal" hidden>
    <div class="compose-header">
      <span id="compose-title">New Message</span>
      <button id="compose-close" title="Close">✕</button>
    </div>
    <div class="read-only-banner" id="read-only-banner" hidden>
      🔒 Preserved evidence -- never sent, can't be edited <span class="evidence-badge" id="read-only-evidence-badge"></span>
    </div>
    <div class="compose-body">
      <select id="compose-to">
        <option value="">To</option>
      </select>
      <input id="compose-subject" placeholder="Subject" autocomplete="off" />
      <textarea id="compose-textarea" placeholder="Compose email"></textarea>
    </div>
    <div class="compose-actions" id="compose-actions">
      <button id="compose-send" disabled>Send</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/js/app.js"></script>
    <script>
      // MERCY desktop shell: tell the Orbit browser where we are so its address bar follows.
      (function () {
        if (window.parent === window) return;
        var send = function () {
          try { parent.postMessage({ type: 'mercy:route', path: location.pathname + location.search + location.hash, title: document.title }, '*'); } catch (e) {}
        };
        send();
        addEventListener('hashchange', send);
        addEventListener('popstate', send);
        var ps = history.pushState, rs = history.replaceState;
        history.pushState = function () { ps.apply(this, arguments); send(); };
        history.replaceState = function () { rs.apply(this, arguments); send(); };
        var t = document.querySelector('title');
        if (t && window.MutationObserver) new MutationObserver(send).observe(t, { childList: true, characterData: true, subtree: true });
      })();
    </script>
    <script>
      // MERCY desktop shell: every evidence badge on screen is something the
      // participant has now actually seen -- tell the console so it can be
      // picked up in the "+ Evidence" search later.
      (function () {
        var seen = new Set();
        var report = function () {
          document.querySelectorAll(".evidence-badge").forEach(function (el) {
            var id = (el.textContent || "").trim();
            if (!id || seen.has(id)) return;
            seen.add(id);
            try { window.top.postMessage({ type: "mercy:evidence-seen", evidence_id: id }, "*"); } catch (e) {}
          });
        };
        report();
        if (window.MutationObserver) new MutationObserver(report).observe(document.body, { childList: true, subtree: true, characterData: true });
      })();
    </script>
  </body>
</html>
