<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>reset</title>
  <style>body { margin: 16px; font: 13px/1.4 ui-monospace, monospace; color: #9fd3ff; background: #07101d; }</style>
</head>
<body>
  <p id="msg">clearing…</p>
  <script>
    // The lobby loads this page in a hidden iframe when a participant logs in:
    // whatever the last game left in this origin's storage (the memo played,
    // the rescue shown, the tracked car) is gone before the next one starts.
    // Storage can be blocked; the parent is told either way.
    try { localStorage.clear(); } catch (e) {}
    try { sessionStorage.clear(); } catch (e) {}
    document.getElementById('msg').textContent = 'cleared';
    try { window.parent.postMessage({ type: 'mercy:reset-done', origin: location.origin }, '*'); } catch (e) {}
  </script>
</body>
</html>
