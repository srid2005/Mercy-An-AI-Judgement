server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # app.js and style.css are a fifth of a megabyte between them, and the
  # event plays over a LAN of laptops, some of them on wifi: text goes out
  # compressed. The pictures are already compressed and are left alone.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

  # Rebuilds should show up on a plain refresh, not a hard one.
  add_header Cache-Control "no-cache, must-revalidate";

  # the two pictures are the biggest files here and never change without
  # their ?v= changing with them: a week in the browser's cache
  location /img/ {
    add_header Cache-Control "public, max-age=604800";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
