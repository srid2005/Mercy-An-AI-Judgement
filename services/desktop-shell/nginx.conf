server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;

    # The event runs over plain HTTP on a VM; the React bundle is the bulk of
    # what the laptop tab waits for, and it compresses about 3:1.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    # the evidence files (case PDF, photos): never cache, real content types
    location /files/ {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
